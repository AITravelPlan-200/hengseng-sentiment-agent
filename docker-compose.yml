version: '3.8'

services:
  hengseng-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hengseng_sentiment_terminal
    ports:
      - "8501:8501"
    environment:
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ENVIRONMENT=production
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
